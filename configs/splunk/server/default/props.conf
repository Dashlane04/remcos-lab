[remcos:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
TIME_PREFIX = "@timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 30

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
# Minimal fallback fields. These retain XML escaping; use vendor add-ons for broader coverage.
EXTRACT-eventcode = <EventID(?:\s+[^>]*)?>(?<EventCode>\d+)</EventID>
EXTRACT-provider = <Provider[^>]*Name=['"](?<ProviderName>[^'"]+)['"]
EXTRACT-computer = <Computer>(?<Computer>[^<]+)</Computer>
EXTRACT-image = <Data\s+Name=['"]Image['"]>(?<Image>[^<]*)</Data>
EXTRACT-commandline = <Data\s+Name=['"]CommandLine['"]>(?<CommandLine>[^<]*)</Data>
EXTRACT-parentimage = <Data\s+Name=['"]ParentImage['"]>(?<ParentImage>[^<]*)</Data>
EXTRACT-processguid = <Data\s+Name=['"]ProcessGuid['"]>(?<ProcessGuid>[^<]*)</Data>
EXTRACT-targetobject = <Data\s+Name=['"]TargetObject['"]>(?<TargetObject>[^<]*)</Data>
EXTRACT-details = <Data\s+Name=['"]Details['"]>(?<Details>[^<]*)</Data>
EXTRACT-destinationip = <Data\s+Name=['"]DestinationIp['"]>(?<DestinationIp>[^<]*)</Data>
EXTRACT-destinationport = <Data\s+Name=['"]DestinationPort['"]>(?<DestinationPort>[^<]*)</Data>
EXTRACT-queryname = <Data\s+Name=['"]QueryName['"]>(?<QueryName>[^<]*)</Data>
