[remcos_sysmon]
definition = search index=remcos_lab (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR (sourcetype="remcos:json" event.dataset="windows.sysmon_operational")) | eval event_code=tostring(coalesce(EventCode, EventID, 'event.code')), provider=coalesce(ProviderName, 'winlog.provider_name'), host_id=coalesce('host.name', Computer, host), image=coalesce(Image, 'process.executable', 'winlog.event_data.Image'), command_line=coalesce(CommandLine, 'process.command_line', 'winlog.event_data.CommandLine'), process_guid=coalesce(ProcessGuid, 'winlog.event_data.ProcessGuid'), registry_target=coalesce(TargetObject, 'registry.path', 'winlog.event_data.TargetObject'), registry_details=coalesce(Details, 'winlog.event_data.Details'), destination_ip=coalesce(DestinationIp, 'destination.ip'), destination_port=coalesce(DestinationPort, 'destination.port') | where provider="Microsoft-Windows-Sysmon"
iseval = 0
