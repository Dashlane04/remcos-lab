name: remcos-soc-lab

services:
  setup:
    profiles: [elastic, fleet]
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Initialize infra/.env first}
    user: "0"
    entrypoint: [bash, /lab/bootstrap.sh]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Initialize infra/.env first}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Initialize infra/.env first}
      LAB_SERVER_IP: ${LAB_SERVER_IP:?Set the private SIEM IP}
    volumes:
      - elastic_certs:/usr/share/elasticsearch/config/certs
      - ./elastic/bootstrap.sh:/lab/bootstrap.sh:ro
    healthcheck:
      test: [CMD-SHELL, "test -f config/certs/es01/es01.crt && test -f config/certs/kibana/kibana.crt && test -f config/certs/fleet-server/fleet-server.crt"]
      interval: 3s
      timeout: 3s
      retries: 60

  es01:
    profiles: [elastic, fleet]
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Initialize infra/.env first}
    depends_on:
      setup:
        condition: service_healthy
    environment:
      node.name: es01
      cluster.name: remcos-lab
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Initialize infra/.env first}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      xpack.security.enabled: "true"
      xpack.license.self_generated.type: basic
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/es01/es01.key
      xpack.security.http.ssl.certificate: certs/es01/es01.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/es01/es01.key
      xpack.security.transport.ssl.certificate: certs/es01/es01.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
    mem_limit: 4g
    ports:
      - "${DATA_BIND_IP:-127.0.0.1}:9200:9200"
      # Stable Ubuntu analyst endpoint; certificate already includes localhost.
      - "127.0.0.1:19200:9200"
    volumes:
      - elastic_certs:/usr/share/elasticsearch/config/certs:ro
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS --cacert config/certs/ca/ca.crt -u elastic:$${ELASTIC_PASSWORD} https://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60

  kibana:
    profiles: [elastic]
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:?Initialize infra/.env first}
    depends_on:
      setup:
        condition: service_completed_successfully
      es01:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/kibana/kibana.crt
      SERVER_SSL_KEY: /usr/share/kibana/config/certs/kibana/kibana.key
      ELASTICSEARCH_HOSTS: '["https://es01:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?Initialize infra/.env first}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca/ca.crt
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Initialize infra/.env first}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Initialize infra/.env first}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Initialize infra/.env first}
    mem_limit: 3g
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - elastic_certs:/usr/share/kibana/config/certs:ro
      - kibana_data:/usr/share/kibana/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS --cacert /usr/share/kibana/config/certs/ca/ca.crt https://localhost:5601/login >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  fleet-server:
    profiles: [fleet]
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION:?Initialize infra/.env first}
    user: root
    depends_on:
      setup:
        condition: service_completed_successfully
      es01:
        condition: service_healthy
    environment:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: "8220"
      FLEET_SERVER_ELASTICSEARCH_HOST: https://es01:9200
      FLEET_SERVER_ELASTICSEARCH_CA: /certs/ca/ca.crt
      FLEET_SERVER_CERT: /certs/fleet-server/fleet-server.crt
      FLEET_SERVER_CERT_KEY: /certs/fleet-server/fleet-server.key
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVER_SERVICE_TOKEN:-}
      FLEET_SERVER_POLICY_ID: ${FLEET_SERVER_POLICY_ID:-}
    mem_limit: 2g
    ports:
      - "${DATA_BIND_IP:-127.0.0.1}:8220:8220"
    volumes:
      - elastic_certs:/certs:ro
      - fleet_state:/usr/share/elastic-agent/state
    healthcheck:
      test: [CMD-SHELL, "curl -fsS --cacert /certs/ca/ca.crt https://localhost:8220/api/status | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"HEALTHY\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  splunk:
    profiles: [splunk]
    image: splunk/splunk:${SPLUNK_VERSION:?Initialize infra/.env first}
    hostname: splunk-lab
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Initialize infra/.env first}
      # Docker creates the named volumes with image ownership. Recursive chown
      # cannot modify the intentionally read-only lab app mounted below.
      SPLUNK_HOME_OWNERSHIP_ENFORCEMENT: "false"
    mem_limit: 4g
    ports:
      - "127.0.0.1:8000:8000"
      - "${DATA_BIND_IP:-127.0.0.1}:9997:9997"
    volumes:
      - splunk_etc:/opt/splunk/etc
      - splunk_var:/opt/splunk/var
      - ../configs/splunk/server:/opt/splunk/etc/apps/remcos_lab:ro
      - ../data/import:/opt/remcos/import:ro
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8000/en-US/account/login >/dev/null && bash -c '</dev/tcp/127.0.0.1/9997'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

volumes:
  elastic_certs:
  elastic_data:
  kibana_data:
  fleet_state:
  splunk_etc:
  splunk_var:
